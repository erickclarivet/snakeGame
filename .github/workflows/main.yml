name: Build Unity project

on:
  push:
    branches:
      - SNAKE-22  # Déclenchement sur la branche 'SNAKE-22'

jobs:
  build:
    runs-on: windows-latest  # Utilisation de Windows

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Installer Android SDK, JDK, et NDK sous Windows
      - name: Install Android SDK, JDK, NDK
        run: |
          # Installer Chocolatey (si ce n'est pas déjà fait)
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
          # Installer les dépendances système nécessaires avec Chocolatey
          choco install openjdk8
          choco install android-sdk
          choco install android-ndk

      # Activer la licence Unity
      - name: Activate Unity License
        uses: game-ci/unity-activate@v2.0.0
        with:
          unityVersion: 2022.3.6f1  # Spécifie la version de Unity

      # Configurer Unity et construire le projet
      - name: Set up Unity project
        uses: game-ci/unity-builder@v4.5.0
        with:
          version: 2022.3.6f1  # Version d'Unity
          targetPlatform: StandaloneAndroid
          projectPath: .
          buildName: SnakeAndroidBuild
          buildPath: ./builds/android
          customParameters: '-batchmode -nographics -quit -logFile ./builds/android/unity_build_log.txt -buildTarget StandaloneAndroid -outputPath ./builds/android/SnakeAndroidBuild.apk'

      # Upload build artifacts (APK)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: SnakeAndroidBuild-${{ github.sha }}-v2022.3.6f1.apk
          path: ./builds/android/SnakeAndroidBuild.apk

      # Upload Unity build logs
      - name: Upload Unity build logs
        uses: actions/upload-artifact@v2
        with:
          name: UnityBuildLogs
          path: ./builds/android/unity_build_log.txt
